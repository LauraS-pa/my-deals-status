name: Weekly My Deals check

on:
  schedule:
    # Monday 09:00 Pacific (PST = UTC-8). During PDT this is 10:00 local.
    - cron: "0 17 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: self-hosted
    # NETWORK SERVICE often has PowerShell script execution disabled.
    defaults:
      run:
        shell: cmd
    steps:
      # Must come before checkout so actions/checkout can clone (not zip-download).
      - name: Add portable Git to PATH
        run: echo C:\actions-runner\git\cmd>>"%GITHUB_PATH%"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run My Deals check
        env:
          # Shared path on this Windows runner (readable by NETWORK SERVICE).
          MYDEALS_AUTH_STATE: C:\actions-runner\my-deals-auth\storage.json
        run: npm run check

      - name: Commit status update
        run: |
          git config user.name "my-deals-status-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json
          git diff --cached --quiet
          if %ERRORLEVEL%==0 (
            echo No status.json changes to commit.
            exit /b 0
          )
          git commit -m "chore: weekly My Deals status check"
          git push
