<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Deals Status</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <p class="brand">My Deals</p>
        <h1>Live product directory</h1>
        <p class="lede">
          Which products are live, and in which apps and regions — refreshed by a weekly agent check.
        </p>
        <p class="meta" id="last-checked">Last checked: —</p>
        <form class="filters" id="filters" hidden>
          <label class="filter-field">
            <span class="filter-label">App</span>
            <select id="filter-app" name="app">
              <option value="">All apps</option>
            </select>
          </label>
          <label class="filter-field">
            <span class="filter-label">Region</span>
            <select id="filter-region" name="region">
              <option value="">All regions</option>
            </select>
          </label>
          <button type="button" class="filter-clear" id="filter-clear" hidden>
            Clear filters
          </button>
        </form>
        <nav class="jump-nav" id="jump-nav" aria-label="Jump to letter" hidden></nav>
      </header>

      <section class="board" aria-labelledby="board-heading">
        <div class="board-head">
          <h2 id="board-heading">Products</h2>
          <p class="board-count" id="board-count" hidden></p>
        </div>
        <div id="boards"></div>
      </section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
